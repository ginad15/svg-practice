<svg width="800" height="600" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- sky -->
  <rect width="80" height="60" fill="#aee3f7"/>

  <!-- blocky sun -->
  <rect x="66" y="4" width="9" height="9" fill="#ffd94d"/>
  <rect x="65" y="5" width="11" height="7" fill="#ffd94d"/>
  <rect x="68" y="2" width="5" height="1" fill="#ffe98a"/>
  <rect x="68" y="15" width="5" height="1" fill="#ffe98a"/>
  <rect x="62" y="7" width="2" height="3" fill="#ffe98a"/>
  <rect x="77" y="7" width="2" height="3" fill="#ffe98a"/>

  <!-- clouds -->
  <g fill="#ffffff">
    <rect x="6" y="8" width="16" height="3"/>
    <rect x="16" y="5" width="10" height="4"/>
    <rect x="24" y="7" width="6" height="2"/>
    <rect x="40" y="9" width="14" height="3"/>
    <rect x="48" y="6" width="9" height="4"/>
  </g>

  <!-- distant birds -->
  <g fill="#5a6a75">
    <rect x="12" y="19" width="2" height="1"/>
    <rect x="15" y="18" width="1" height="1"/>
    <rect x="17" y="19" width="2" height="1"/>
    <rect x="30" y="15" width="2" height="1"/>
    <rect x="33" y="16" width="2" height="1"/>
  </g>

  <!-- grass + road -->
  <rect y="53" width="80" height="7" fill="#7ec850"/>
  <rect y="53" width="80" height="1" fill="#5da33a"/>
  <rect y="54" width="80" height="1" fill="#63a844"/>
  <rect x="6" y="57" width="5" height="1" fill="#68b043"/>
  <rect x="62" y="58" width="6" height="1" fill="#68b043"/>

  <!-- bike shadow -->
  <rect x="12" y="52" width="56" height="2" fill="#4e8f36"/>

  <!-- speed pixels -->
  <g fill="#ffffff" opacity="0.65">
    <rect x="3" y="33" width="7" height="1"/>
    <rect x="1" y="38" width="9" height="1"/>
    <rect x="4" y="43" width="6" height="1"/>
    <rect x="7" y="28" width="4" height="1"/>
  </g>

  <!-- ============ WHEELS ============ -->
  <g fill="none" stroke="#2b2f33" stroke-width="1.4">
    <circle cx="20" cy="44" r="9"/>
    <circle cx="56" cy="44" r="9"/>
  </g>
  <g fill="none" stroke="#8a8f96" stroke-width="0.4">
    <path d="M20 35v18M11 44h18M14 38l12 12M14 50l12-12"/>
    <path d="M56 35v18M47 44h18M50 38l12 12M50 50l12-12"/>
  </g>
  <rect x="19" y="43" width="2" height="2" fill="#2b2f33"/>
  <rect x="55" y="43" width="2" height="2" fill="#2b2f33"/>

  <!-- ============ FRAME ============ -->
  <g fill="none" stroke="#2b6ea8" stroke-width="1">
    <path d="M20 44L38 42"/>
    <path d="M38 42L32 30"/>
    <path d="M32 30L20 44"/>
    <path d="M38 42L52 30"/>
    <path d="M32 30L52 30"/>
    <path d="M52 30L56 44"/>
  </g>
  <g fill="none" stroke="#7fc4ee" stroke-width="0.3">
    <path d="M33 29.5L51 29.5"/>
    <path d="M39 41L51 31"/>
  </g>

  <!-- seat -->
  <path d="M32 30L29 27" stroke="#4a3a2a" stroke-width="0.8"/>
  <rect x="24" y="26" width="8" height="2" fill="#7a5230"/>

  <!-- handlebar -->
  <path d="M52 30V26" stroke="#2b2f33" stroke-width="0.8"/>
  <rect x="49" y="25" width="7" height="1" fill="#2b2f33"/>
  <rect x="47" y="25" width="2" height="2" fill="#7a5230"/>

  <!-- crank + pedals -->
  <rect x="37" y="41" width="3" height="3" fill="#e6eaee" stroke="#2b2f33" stroke-width="0.4"/>
  <path d="M38 42L42 38M38 42L34 46" stroke="#2b2f33" stroke-width="0.7"/>
  <rect x="41" y="37" width="3" height="2" fill="#2b2f33"/>
  <rect x="33" y="45" width="3" height="2" fill="#2b2f33"/>

  <!-- ============ PELICAN ============ -->
  <!-- tail -->
  <rect x="19" y="27" width="8" height="3" fill="#e6ecf2"/>
  <rect x="16" y="28" width="4" height="2" fill="#e6ecf2"/>

  <!-- legs -->
  <rect x="34" y="35" width="2" height="3" fill="#f5a623"/>
  <rect x="36" y="37" width="5" height="1" fill="#f5a623"/>
  <rect x="40" y="37" width="2" height="1" fill="#f5a623"/>
  <rect x="31" y="35" width="2" height="4" fill="#f5a623"/>
  <rect x="31" y="39" width="1" height="7" fill="#f5a623"/>
  <rect x="41" y="36" width="3" height="2" fill="#ffb84d"/>
  <rect x="33" y="44" width="3" height="2" fill="#ffb84d"/>

  <!-- body -->
  <rect x="26" y="26" width="20" height="10" fill="#fbfdff"/>
  <rect x="25" y="35" width="18" height="2" fill="#eef3f8"/>
  <rect x="24" y="28" width="2" height="6" fill="#fbfdff"/>

  <!-- neck -->
  <rect x="42" y="22" width="6" height="6" fill="#fbfdff"/>
  <rect x="44" y="19" width="6" height="4" fill="#fbfdff"/>
  <rect x="41" y="26" width="3" height="3" fill="#fbfdff"/>

  <!-- head -->
  <rect x="44" y="16" width="8" height="4" fill="#fbfdff"/>
  <rect x="45" y="14" width="6" height="2" fill="#fbfdff"/>
  <rect x="47" y="13" width="3" height="1" fill="#fbfdff"/>

  <!-- bill -->
  <rect x="52" y="16" width="12" height="2" fill="#f5a623"/>
  <rect x="64" y="17" width="3" height="1" fill="#e2761f"/>
  <rect x="52" y="18" width="11" height="2" fill="#e8912a"/>
  <rect x="54" y="20" width="8" height="2" fill="#d9731c"/>
  <rect x="58" y="22" width="4" height="1" fill="#d9731c"/>
  <rect x="55" y="17" width="5" height="1" fill="#ffc04d"/>

  <!-- eye -->
  <rect x="49" y="16" width="2" height="2" fill="#2b2f33"/>
  <rect x="49" y="16" width="1" height="1" fill="#ffffff"/>

  <!-- wing to handlebar -->
  <rect x="28" y="27" width="17" height="4" fill="#d7e0e9"/>
  <rect x="38" y="25" width="12" height="3" fill="#d7e0e9"/>
  <rect x="47" y="24" width="6" height="2" fill="#d7e0e9"/>
  <rect x="30" y="29" width="14" height="1" fill="#b8c6d3"/>
  <rect x="34" y="27" width="2" height="1" fill="#b8c6d3"/>
  <rect x="40" y="27" width="2" height="1" fill="#b8c6d3"/>
  <rect x="46" y="27" width="2" height="1" fill="#b8c6d3"/>
</svg>