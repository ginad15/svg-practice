<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1321"/>
      <stop offset="100%" stop-color="#1b263b"/>
    </linearGradient>
    <linearGradient id="moonGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0f4ff"/>
      <stop offset="100%" stop-color="#e0e8f0"/>
    </linearGradient>
    <linearGradient id="bikeFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d94aa"/>
      <stop offset="100%" stop-color="#064e6b"/>
    </linearGradient>
    <linearGradient id="pelBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e5e8"/>
    </linearGradient>
    <linearGradient id="bill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#f5a623"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#nightSky)"/>

  <!-- moon -->
  <g>
    <circle cx="700" cy="100" r="38" fill="#fff" opacity="0.9"/>
    <circle cx="700" cy="100" r="28" fill="none" stroke="#d0d8e8" stroke-width="2"/>
    <path d="M700 62 L700 38 M662 80 L738 80 M674 70 L726 70 M682 60 L718 60" stroke="#a0a8c0" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- stars -->
  <g fill="#fff" opacity="0.8">
    <circle cx="120" cy="50" r="1.5"/>
    <circle cx="150" cy="180" r="1"/>
    <circle cx="200" cy="120" r="2"/>
    <circle cx="260" cy="60" r="1.5"/>
    <circle cx="300" cy="200" r="1"/>
    <circle cx="340" cy="140" r="2"/>
    <circle cx="380" cy="90" r="1.5"/>
    <circle cx="420" cy="220" r="1"/>
    <circle cx="460" cy="100" r="2"/>
    <circle cx="500" cy="250" r="1.5"/>
    <circle cx="540" cy="120" r="1"/>
    <circle cx="580" cy="200" r="2"/>
    <circle cx="620" cy="80" r="1.5"/>
    <circle cx="660" cy="160" r="1"/>
    <circle cx="720" cy="50" r="2"/>
    <circle cx="750" cy="180" r="1.5"/>
  </g>

  <!-- snow sparkles -->
  <g fill="#fff" opacity="0.6">
    <circle cx="350" cy="300" r="1"/>
    <circle cx="400" cy="280" r="1"/>
    <circle cx="450" cy="320" r="1"/>
    <circle cx="500" cy="290" r="1"/>
    <circle cx="380" cy="350" r="1"/>
    <circle cx="420" cy="370" r="1"/>
    <circle cx="520" cy="310" r="1"/>
    <circle cx="560" cy="330" r="1"/>
  </g>

  <!-- ground line -->
  <line x1="0" y1="530" x2="800" y2="530" stroke="#2a2e35" stroke-width="6"/>
  <line x1="0" y1="530" x2="800" y2="530" stroke="#4a4e55" stroke-width="2"/>

  <!-- bike tracks hint -->
  <g stroke="#5a5e64" stroke-width="3" stroke-linecap="round" opacity="0.5">
    <path d="M100 480 Q 150 500 250 490 Q 300 470 380 500 Q 450 490 550 480 Q 620 460 680 500 Q 730 470 780 500"/>
  </g>

  <!-- ============ BICYCLE ============ -->
  <g>
    <!-- rear wheel -->
    <circle cx="260" cy="445" r="78" fill="none" stroke="#0d94aa" stroke-width="8"/>
    <g stroke="#6ab0c8" stroke-width="2.5">
      <path d="M260 369v152M184 445h152M207 392l110 110M207 498l110-110"/>
    </g>
    <circle cx="260" cy="445" r="7" fill="#0d94aa"/>

    <!-- front wheel -->
    <circle cx="550" cy="445" r="78" fill="none" stroke="#0d94aa" stroke-width="8"/>
    <g stroke="#6ab0c8" stroke-width="2.5">
      <path d="M550 369v152M474 445h152M497 392l110 110M497 498l110-110"/>
    </g>
    <circle cx="550" cy="445" r="7" fill="#0d94aa"/>

    <!-- chain -->
    <g stroke="#3a4147" stroke-width="3.5" stroke-dasharray="6 4" fill="none">
      <path d="M390 434L280 436"/>
      <path d="M390 466L280 452"/>
    </g>
    <circle cx="260" cy="445" r="12" fill="none" stroke="#3a4147" stroke-width="4"/>

    <g stroke="url(#bikeFrame)" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M260 445L400 450"/>
      <path d="M400 450L330 305"/>
      <path d="M330 305L260 445"/>
      <path d="M400 450L520 305"/>
      <path d="M330 305L520 305"/>
      <path d="M520 305Q528 378 550 445"/>
    </g>

    <path d="M330 305v-24" stroke="#0d2839" stroke-width="7" stroke-linecap="round"/>
    <path d="M300 280q20-10 45-2" fill="none" stroke="#2d2d2d" stroke-width="13" stroke-linecap="round"/>

    <path d="M520 305v-30" stroke="#0d2839" stroke-width="7" stroke-linecap="round"/>
    <path d="M495 272q18-12 42-6" fill="none" stroke="#0d2839" stroke-width="7" stroke-linecap="round"/>
    <path d="M495 272L482 280" stroke="#2d2d2d" stroke-width="12" stroke-linecap="round"/>

    <circle cx="400" cy="450" r="20" fill="#e8eff7" stroke="#0d2839" stroke-width="4"/>
    <circle cx="400" cy="450" r="6" fill="#0d2839"/>
    <path d="M400 450L425 425" stroke="#0d2839" stroke-width="6" stroke-linecap="round"/>
    <rect x="412" y="418" width="32" height="10" rx="4" fill="#0d2839"/>
    <path d="M400 450L375 475" stroke="#0d2839" stroke-width="6" stroke-linecap="round"/>
    <rect x="368" y="470" width="32" height="10" rx="4" fill="#0d2839"/>

    <!-- headlight -->
    <circle cx="560" cy="400" r="12" fill="#ffffff" opacity="0.9"/>
    <circle cx="560" cy="400" r="6" fill="#e5e5e5"/>
    <path d="M554 404 L566 404 M558 400 L562 408" stroke="#d0d8e8" stroke-width="1.5"/>

    <!-- rear light / reflector -->
    <circle cx="270" cy="495" r="8" fill="#f5a623" opacity="0.4"/>
  </g>

  <!-- ============ PELICAN ============ -->
  <g>
    <!-- tail -->
    <path d="M318 305q-46-24-78-12 22 8 34 23-26 0-42 18 32-8 64-4z" fill="#dde4ea" stroke="#c3ccd4" stroke-width="2"/>

    <!-- snow on back -->
    <g fill="#f0f8ff" opacity="0.7">
      <path d="M310 280 Q 270 250 240 265 Q 265 270 280 285 Q 255 280 240 295 Q 270 290 295 300 Z"/>
      <path d="M330 290 Q 300 275 275 285 Q 285 270 300 290 Z"/>
    </g>

    <!-- legs -->
    <g stroke="#f08c3c" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M412 350Q420 385 428 418"/>
      <path d="M382 354Q378 410 378 465"/>
    </g>
    <g fill="#ff6b6b" stroke="#e2761f" stroke-width="2" stroke-linejoin="round">
      <path d="M414 410h32l-5 12h-30z"/>
      <path d="M362 460h32l-5 12h-30z"/>
    </g>

    <!-- body -->
    <ellipse cx="382" cy="305" rx="76" ry="54" fill="url(#pelBody)" stroke="#cdd5db" stroke-width="2" transform="rotate(-8 382 305)"/>

    <!-- neck -->
    <path d="M448 280Q468 248 502 220" stroke="url(#pelBody)" stroke-width="26" fill="none" stroke-linecap="round"/>

    <!-- head -->
    <circle cx="508" cy="198" r="28" fill="url(#pelBody)" stroke="#cdd5db" stroke-width="2"/>

    <!-- bill -->
    <path d="M528 186L686 206L528 214Z" fill="url(#bill)" stroke="#e8912a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M528 214Q602 268 686 206Q620 248 528 214Z" fill="url(#pouch)" stroke="#e8912a" stroke-width="2" stroke-linejoin="round"/>
    <path d="M548 220Q612 256 672 214" fill="none" stroke="#c25e10" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

    <!-- eye -->
    <circle cx="514" cy="190" r="6" fill="#1a1d22"/>
    <circle cx="516" cy="188" r="2.5" fill="#fff"/>

    <!-- wing to handlebar -->
    <path d="M346 284C395 248 468 248 498 265C489 290 432 312 392 316C360 310 346 298 346 284Z" fill="#e2e8f0" stroke="#a0a8c0" stroke-width="2.5" stroke-linejoin="round"/>
    <g fill="none" stroke="#a0a8c0" stroke-width="2.5" stroke-linecap="round">
      <path d="M368 296C412 280 448 272 482 268"/>
      <path d="M380 308C420 294 448 282 476 270"/>
    </g>
    <path d="M485 258q22-3 30 9-8 16-30 12-14-12-2-24z" fill="#e2e8f0" stroke="#a0a8c0" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- scarf / winter wrap -->
    <g fill="#3182ce" stroke="#1e56a0" stroke-width="2" stroke-linejoin="round">
      <path d="M460 230 C 410 210 370 200 330 220 C 290 240 260 260 280 280 C 300 300 340 310 380 290 C 420 270 460 250 460 230 Z"/>
      <path d="M440 240 l -12 12 M462 238 l -12 13" stroke="#1e56a0" stroke-width="3"/>
    </g>
  </g>
</svg>